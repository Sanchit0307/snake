<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake | Sanchit Marwah</title>
<style>
:root{--red:#ff1e2d;--text:#f2f2f2;--muted:#8a8a8a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(circle at 75% 15%,#2a0508 0,#050505 55%) #050505;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;min-height:100vh;-webkit-user-select:none;user-select:none}
h1{font-size:clamp(1.5rem,5vw,2.1rem);letter-spacing:.02em}
h1 span{color:var(--red)}
.hud{display:flex;gap:28px;font-size:.95rem;color:var(--muted)}
.hud b{color:var(--text);font-variant-numeric:tabular-nums}
.wrap{position:relative;width:min(92vw,420px);aspect-ratio:1;touch-action:none}
canvas{width:100%;height:100%;display:block;background:#0b0b0b;border:2px solid #2a2a2a;border-radius:12px;box-shadow:0 0 40px rgba(255,30,45,.18)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.78);border-radius:12px;text-align:center;padding:20px}
.overlay.hidden{display:none}
.overlay h2{font-size:1.7rem}
.overlay p{color:var(--muted);font-size:.9rem;line-height:1.5}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:1rem;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.15)}
a{color:var(--muted);font-size:.85rem}
a:hover{color:var(--red)}
.pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px}
.pad button{background:#161616;border:1px solid #2a2a2a;font-size:1.3rem;padding:0}
.pad .up{grid-column:2}
.pad .left{grid-column:1;grid-row:2}
.pad .down{grid-column:2;grid-row:2}
.pad .right{grid-column:3;grid-row:2}
@media (hover:none){.pad{display:grid}}
</style>
</head>
<body>
<h1>Sanchit's <span>Snake</span></h1>
<div class="hud"><div>Score <b id="score">0</b></div><div>Best <b id="best">0</b></div></div>

<div class="wrap" id="wrap">
  <canvas id="c"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="title">Snake</h2>
    <p id="msg">Arrow keys / WASD to move.<br>On mobile, swipe or use the buttons.</p>
    <button id="startBtn">Play</button>
    <a href="https://github.com/Sanchit0307">Back to my GitHub</a>
  </div>
</div>

<div class="pad">
  <button class="up" data-d="up">&uarr;</button>
  <button class="left" data-d="left">&larr;</button>
  <button class="down" data-d="down">&darr;</button>
  <button class="right" data-d="right">&rarr;</button>
</div>

<script>
const N = 20;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const titleEl = document.getElementById('title');
const msgEl = document.getElementById('msg');

let size = 0, snake, dir, nextDir, food, score = 0, best = 0, timer = null, running = false;

try { best = parseInt(localStorage.getItem('snakeBest'), 10) || 0; } catch (e) {}
bestEl.textContent = best;

function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  size = canvas.width / N;
  draw();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = dir;
  score = 0;
  scoreEl.textContent = 0;
  placeFood();
}

function delay() { return Math.max(60, 130 - score * 3); }

function start() {
  clearTimeout(timer);
  reset();
  running = true;
  overlay.classList.add('hidden');
  draw();
  timer = setTimeout(tick, delay());
}

function gameOver() {
  running = false;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem('snakeBest', best); } catch (e) {}
  }
  titleEl.textContent = 'Game Over';
  msgEl.innerHTML = 'Score: <b>' + score + '</b>' + (score && score === best ? '<br>New best!' : '');
  document.getElementById('startBtn').textContent = 'Play again';
  overlay.classList.remove('hidden');
}

function tick() {
  if (!running) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
  if (hitWall || snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
  timer = setTimeout(tick, delay());
}

function setDir(x, y) {
  if (!running) return;
  if (x === -dir.x && y === -dir.y) return;
  nextDir = { x, y };
}

function draw() {
  if (!size) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * size, 0); ctx.lineTo(i * size, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * size); ctx.lineTo(canvas.width, i * size); ctx.stroke();
  }
  if (!snake) return;
  // food
  ctx.save();
  ctx.shadowColor = '#ff1e2d';
  ctx.shadowBlur = size * 0.8;
  ctx.fillStyle = '#ff1e2d';
  ctx.beginPath();
  ctx.arc((food.x + 0.5) * size, (food.y + 0.5) * size, size * 0.32, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // snake
  snake.forEach((s, i) => {
    const t = i / Math.max(snake.length - 1, 1);
    const l = Math.round(55 - t * 30);
    ctx.fillStyle = i === 0 ? '#ffffff' : 'hsl(355,90%,' + l + '%)';
    const pad = size * 0.08, r = size * 0.22;
    const x = s.x * size + pad, y = s.y * size + pad, w = size - pad * 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + w, r);
    ctx.arcTo(x + w, y + w, x, y + w, r);
    ctx.arcTo(x, y + w, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  });
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
  if (map[k]) { e.preventDefault(); setDir(map[k][0], map[k][1]); }
  if ((k === 'enter' || k === ' ') && !running) { e.preventDefault(); start(); }
});

document.querySelectorAll('.pad button').forEach(b => {
  b.addEventListener('click', () => {
    const d = b.dataset.d;
    if (d === 'up') setDir(0, -1);
    if (d === 'down') setDir(0, 1);
    if (d === 'left') setDir(-1, 0);
    if (d === 'right') setDir(1, 0);
  });
});

let tx = 0, ty = 0;
const wrap = document.getElementById('wrap');
wrap.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
wrap.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
wrap.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
});

document.getElementById('startBtn').addEventListener('click', start);
window.addEventListener('resize', resize);
reset();
resize();
</script>
</body>
</html>
